<div
  class="dashboard-wrapper"
  [class.sidebar-collapsed]="isSidebarCollapsed()"
  [class.mobile]="isMobile()"
  [class.menu-abierto]="isSidebarOpenMobile()"
>

  <!-- =========================
       SIDEBAR DESKTOP (≥ 992px)
  ========================== -->
  @if (!isMobile()) {
    <app-dashboard-sidebar class="desktop-sidebar" [collapsed]="isSidebarCollapsed()"></app-dashboard-sidebar>
  }

  <!-- =========================
       SIDEBAR MÓVIL (cajón lateral, solo cuando está abierto)
  ========================== -->
  @if (isMobile() && isSidebarOpenMobile()) {
    <app-dashboard-sidebar
      class="mobile-sidebar"
      [collapsed]="false"
      (click)="closeMobileSidebar()">
    </app-dashboard-sidebar>

    <div class="mobile-overlay" (click)="closeMobileSidebar()"></div>
  }

  <!-- ACCESIBILIDAD -->
  <app-accesibilidad></app-accesibilidad>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="dashboard-main">
    <app-dashboard-topbar (toggleSidebar)="toggleSidebar()"></app-dashboard-topbar>

    <!-- MIGAS DE PAN -->
    <app-breadcrumb variante="panel" />

    <main class="dashboard-content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
