<aside class="dashboard-sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-logo-wrapper">
    <img  src="HSJG-LOGO_POSITIVO.png" alt="Logo Hospital">

    </div>
    <div class="logo">
    <strong>{{ permisos.usuario()?.nombre || 'ESE Guaviare' }}</strong>
    <br>
    <span>{{ permisos.nombreRol() }}</span>
    <br>

    <button class="btn-cerrarSesion" type="button" (click)="openLogoutModal()">
      Cerrar sesión
    </button>

  </div>

  <!-- Solo se muestran los módulos que permite el rol del usuario -->
  <nav class="sidebar-nav" aria-label="Menú de administración">
    @for (g of permisos.menu(); track g.grupo) {
      @if (g.grupo) {
        <span class="nav-grupo">{{ g.grupo }}</span>
      }
      @for (e of g.enlaces; track e.ruta) {
        <a [routerLink]="e.ruta" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: !!e.exacto }" [attr.data-tooltip]="e.texto">
          <span class="icon">{{ e.icono }}</span><span class="text">{{ e.texto }}</span>
        </a>
      }
    }
  </nav>
</aside>

<!-- MODAL -->
<div class="modal-backdrop" *ngIf="showLogoutModal">
  <div class="modal">

    <h2>Confirmar cierre de sesión</h2>
    <p>¿Está seguro de que desea cerrar la sesión?</p>

    <div class="modal-actions">
      <button class="btn-cancel" (click)="closeLogoutModal()">
        Cancelar
      </button>

      <button class="btn-confirm" (click)="confirmLogout()">
        Cerrar sesión
      </button>
    </div>

  </div>
</div>
