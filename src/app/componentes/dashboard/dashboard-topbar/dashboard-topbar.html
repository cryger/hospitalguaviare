<header class="dashboard-topbar">
  <div class="topbar-left">
    <button class="toggle-menu" type="button" (click)="toggle()" aria-label="Mostrar u ocultar menú">☰</button>
    <span class="titulo-topbar">Panel de administración</span>
  </div>

  <div class="topbar-right">
    <a class="ver-sitio" routerLink="/" target="_blank" rel="noopener">Ver sitio ↗</a>
    <div class="usuario" [title]="nombreUsuario() + ' · ' + permisos.nombreRol()">
      <span class="avatar" aria-hidden="true">{{ iniciales }}</span>
      <span class="usuario-info">
        <strong>{{ nombreUsuario() }}</strong>
        <small>{{ permisos.nombreRol() }}</small>
      </span>
    </div>
  </div>
</header>
